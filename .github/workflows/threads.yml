# Threads の承認制投稿（tools/th_queue.py）。Instagram 運用会社（-ai_employees-）と同じ流れ。
# - PR（Claude が出す下書き）では、下書きの形だけを確かめる（何も投稿しない）。
# - PR を Merge ＝ 承認。main に入った下書きを、毎時5分（日本時間 8:05〜23:05）に確認して、予定時刻を過ぎたものを投稿する。
# - 定期実行は Settings ➔ Secrets and variables ➔ Actions ➔ Variables に TH_ENABLED=true を入れるまで何もしない。
# - 鍵は Secrets：THREADS_ACCESS_TOKEN・WORDPRESS_TOKEN（写真付きのときだけ）・CHATWORK_API_TOKEN
name: threads

on:
  pull_request:
    paths: ["content/threads/**", "tools/**", "ai_employees/**", "docs/handover/**"]
  schedule:
    - cron: "5 23,0-14 * * *"  # UTC。日本時間 8:05〜23:05 の毎時
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 送らずに確認だけ / 0 = 本当に投稿"
        default: "1"
        type: choice
        options: ["1", "0"]

concurrency:
  group: threads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/content_rules.py && python3 tools/week_notes.py --self-test && python3 tools/th_queue.py --self-test && python3 tools/th_queue.py --check && python3 tools/th_insights.py --self-test && python3 tools/build_ai_employees.py --check

  post:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.TH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: post to Threads
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          WORDPRESS_TOKEN: ${{ secrets.WORDPRESS_TOKEN }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ vars.CHATWORK_ROOM_ID }}
        run: python3 tools/th_queue.py
